<!doctype html>
<!--
  WIDS Dashboard — PUBLIC LIVE DEMO (sample data, no login, no backend).
  This is a safe-to-share copy of the real dashboard for portfolio/LinkedIn.
  Deploy this folder to Vercel / Netlify / GitHub Pages and link it. See docs/PUBLISH.md.
  The REAL dashboard (token-gated, live data) is served by the dashboard Lambda.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<title>WIDS Dashboard — Live Demo</title>
<style>
:root{--bg:#080d1c;--bg2:#0d1428;--card:#111a35;--line:#1d2950;--txt:#e8edff;--dim:#8794c4;--accent:#4f7cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1100px 600px at 50% -10%,#17224e 0%,var(--bg) 62%) no-repeat,var(--bg);
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(13,20,40,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{font-size:22px}.brand .t{font-weight:800;font-size:16px;line-height:1.1}.brand .s{font-size:11px;color:var(--dim);margin-top:2px}
.pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.4px}
.pill.on{background:rgba(52,211,153,.15);color:var(--ok);border:1px solid rgba(52,211,153,.32)}
.demo{font-size:10px;font-weight:800;letter-spacing:1px;color:#0b1020;background:var(--warn);border-radius:6px;padding:4px 8px}
main{max-width:760px;margin:0 auto;padding:18px 16px 44px}
.note{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#f4d58a;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:16px}
.hero{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--ok);box-shadow:0 0 0 6px rgba(52,211,153,.13)}
.hero-t{font-weight:800;font-size:17px}.hero-s{color:var(--dim);font-size:12.5px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center}
.stat .n{font-size:21px;font-weight:800}.stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-top:5px}
.stat.tap{cursor:pointer;position:relative;transition:.15s}
.stat.tap:hover{border-color:#2f3f7d;background:#131d3d}
.stat.tap:active{transform:scale(.98)}
.stat .go{position:absolute;top:7px;right:10px;font-size:13px;font-weight:800;color:var(--dim)}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin:26px 0 10px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.h2row h2{margin:0}
.morehint{font-size:11px;color:var(--dim)}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.card.high{border-left-color:var(--bad)}.card.mid{border-left-color:var(--warn)}.card.low{border-left-color:var(--accent)}
.card .ico{font-size:20px;flex:none}.card .body{flex:1;min-width:0}.card b{font-size:14.5px}
.card .meta{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ago{color:var(--dim);font-size:11.5px;white-space:nowrap;flex:none}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.dev{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.dev .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.4px}.dev .v{font-size:11px;color:var(--dim);margin-top:4px}
.foot{color:var(--dim);font-size:11px;text-align:center;margin-top:28px;opacity:.75}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(4,7,16,.62);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -18px 60px rgba(0,0,0,.55)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim)}
.sheet-b{overflow-y:auto;padding:14px 16px 26px;-webkit-overflow-scrolling:touch}
.x{background:none;border:1px solid transparent;color:var(--dim);font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer}
.x:hover{background:var(--card);border-color:var(--line)}
@media(min-width:620px){.modal{align-items:center}.sheet{border-radius:20px;max-height:82vh}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">🛡️</span><div><div class="t">WIDS</div><div class="s">WiFi Intrusion Detection</div></div></div>
  <span class="pill on">● ONLINE</span><span class="demo">DEMO</span>
</header>
<main>
  <div class="note">👋 This is a <b>public demo</b> with sample data. The real device streams live encrypted alerts to a private, token-protected dashboard.</div>
  <div class="hero">
    <div class="dot"></div>
    <div><div class="hero-t">Monitoring — recent activity</div><div id="hs" class="hero-s"></div></div>
  </div>
  <div class="stats">
    <div id="cAlerts" class="stat tap"><span class="go">›</span><div class="n" id="sA">0</div><div class="l">Alerts</div></div>
    <div id="cDevices" class="stat tap"><span class="go">›</span><div class="n" id="sD">0</div><div class="l">Devices</div></div>
    <div class="stat"><div class="n" id="sS">—</div><div class="l">Last seen</div></div>
  </div>
  <div class="h2row"><h2>Recent activity</h2><span id="moreHint" class="morehint"></span></div>
  <div id="alerts"></div>
  <div class="foot">ESP32 · AWS serverless · sample data</div>
</main>

<div id="modal" class="modal">
  <div class="sheet">
    <div class="sheet-h"><h3 id="mTitle">…</h3><button id="mClose" class="x">✕ Close</button></div>
    <div id="mBody" class="sheet-b"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), now=Math.floor(Date.now()/1000);
const ICON={deauth_flood:'📡',disassoc_flood:'📡',evil_twin:'👯',unknown_device:'❓',test_trigger:'🧪'};
const NAME={deauth_flood:'Deauthentication flood',disassoc_flood:'Disassociation flood',evil_twin:'Evil-twin access point',unknown_device:'Unknown device joined',test_trigger:'Test alert'};
const SEV={deauth_flood:'high',disassoc_flood:'high',evil_twin:'high',unknown_device:'mid',test_trigger:'low'};
function ago(ts){let d=now-ts;if(d<0)d=0;if(d<60)return d+'s ago';if(d<3600)return(d/60|0)+'m ago';if(d<86400)return(d/3600|0)+'h ago';return(d/86400|0)+'d ago';}
function esc(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));}
function alertCard(x){
  const bits=[esc(x.mac),esc(x.vendor),x.rssi+' dBm'];
  return `<div class="card ${SEV[x.event]}"><span class="ico">${ICON[x.event]}</span>`+
    `<div class="body"><b>${NAME[x.event]}</b><div class="meta">${bits.join(' · ')}</div></div>`+
    `<span class="ago">${ago(x.ts)}</span></div>`;
}
function deviceCard(o){return `<div class="dev"><div class="m">📱 ${esc(o.mac)}</div><div class="v">${esc(o.vendor)}</div></div>`;}
const DEMO={
  lastSeen:now-38,
  alerts:[
    {event:'deauth_flood', ts:now-240,  mac:'C8:3A:35:9F:12:04', vendor:'Unknown vendor', rssi:-41},
    {event:'unknown_device',ts:now-5400, mac:'54:27:1E:AB:CD:EF', vendor:'AzureWave (Wi-Fi module — laptop / TV / IoT)', rssi:-35},
    {event:'evil_twin',    ts:now-9000, mac:'C0:FF:EE:22:88:10', vendor:'Unknown vendor', rssi:-57},
    {event:'unknown_device',ts:now-70000,mac:'5A:1B:2C:3D:4E:5F', vendor:'Randomized MAC (privacy mode — usually a phone)', rssi:-52}
  ],
  devices:[
    {mac:'54:27:1E:AB:CD:EF', vendor:'AzureWave (Wi-Fi module — laptop / TV / IoT)'},
    {mac:'5A:1B:2C:3D:4E:5F', vendor:'Randomized MAC (privacy mode — usually a phone)'},
    {mac:'A4:83:E7:9C:41:2B', vendor:'Apple (iPhone / iPad / Mac)'},
    {mac:'34:02:86:71:0D:AA', vendor:'Intel (likely laptop / PC)'}
  ]
};
$('#hs').textContent=DEMO.alerts.length+' alerts recorded · last contact '+ago(DEMO.lastSeen);
$('#sA').textContent=DEMO.alerts.length; $('#sD').textContent=DEMO.devices.length;
$('#sS').textContent=(now-DEMO.lastSeen)+'s';
const recent=DEMO.alerts.slice(0,3);
$('#alerts').innerHTML=recent.map(alertCard).join('');
$('#moreHint').textContent=DEMO.alerts.length>3?('+'+(DEMO.alerts.length-3)+' more — tap Alerts'):'';

function openSheet(mode){
  if(mode==='alerts'){
    $('#mTitle').textContent='All alerts ('+DEMO.alerts.length+')';
    $('#mBody').innerHTML=DEMO.alerts.map(alertCard).join('');
  }else{
    $('#mTitle').textContent='Known devices ('+DEMO.devices.length+')';
    $('#mBody').innerHTML='<div class="devs">'+DEMO.devices.map(deviceCard).join('')+'</div>';
  }
  $('#modal').classList.add('open');
}
function closeSheet(){$('#modal').classList.remove('open');}
$('#cAlerts').onclick=()=>openSheet('alerts');
$('#cDevices').onclick=()=>openSheet('devices');
$('#mClose').onclick=closeSheet;
$('#modal').onclick=e=>{if(e.target===$('#modal'))closeSheet();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
</script>
</body>
</html>
