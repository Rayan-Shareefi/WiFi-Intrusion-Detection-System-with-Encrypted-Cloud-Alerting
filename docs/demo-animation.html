<!doctype html>
<!--
  WIDS animated explainer — a looping motion graphic that cycles through all three
  detections: ESP32 detects -> encrypted alert to AWS (which processes it) -> iPhone.

  MAKE IT A VIDEO/GIF for LinkedIn:
   1. Open in a browser, press F11 (full screen).
   2. Record ~22 seconds (cycles deauth -> evil-twin -> unknown device) with
      ScreenToGif (Windows, records straight to GIF), Xbox Game Bar (Win+G), or OBS.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIDS — how it works</title>
<style>
  :root{--bg:#080d1c;--card:#111a35;--line:#1d2950;--txt:#e8edff;--dim:#8794c4;--accent:#4f7cff;--ok:#34d399;--bad:#f87171}
  *{box-sizing:border-box;margin:0}
  body{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(1200px 720px at 50% -12%,#17224e 0%,var(--bg) 58%) no-repeat,var(--bg);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
  .stage{width:min(1140px,97vw)}
  .title{text-align:center;font-size:32px;font-weight:800}
  .sub{text-align:center;color:var(--dim);font-size:17px;margin:10px 0 70px}

  .row{display:flex;align-items:center;justify-content:center;gap:0}
  .node{flex:none;width:220px;background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:20px 12px;text-align:center;position:relative}
  .node .big{font-size:26px;font-weight:800}
  .node .small{color:var(--dim);font-size:14px;margin-top:6px;white-space:nowrap}
  .wire{flex:1;max-width:150px;height:4px;border-radius:2px;position:relative;
    background:linear-gradient(90deg,#1d2950,#2a3a6e,#1d2950)}
  .pkt{position:absolute;top:50%;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;
    box-shadow:0 0 20px 4px rgba(79,124,255,.75);opacity:0}

  .detect{position:absolute;top:-52px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:rgba(248,113,113,.15);color:var(--bad);border:1px solid rgba(248,113,113,.45);
    border-radius:22px;padding:7px 16px;font-size:16px;font-weight:700;opacity:0;animation:labelShow 7s infinite}
  .awsout{position:absolute;bottom:-54px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:rgba(79,124,255,.16);color:#aec3ff;border:1px solid rgba(79,124,255,.45);
    border-radius:22px;padding:8px 16px;font-size:15px;font-weight:700;opacity:0;animation:awsOut 7s infinite}

  .esp{animation:espFlash 7s infinite}
  .aws{animation:awsPulse 7s infinite}
  .p1{animation:travel1 7s infinite}
  .p2{animation:travel2 7s infinite}

  /* iPhone */
  .phone{flex:none;width:180px;display:flex;justify-content:center}
  .iphone{width:158px;height:288px;border-radius:42px;background:#05070f;border:4px solid #2b3663;
    position:relative;box-shadow:0 14px 40px rgba(0,0,0,.5), inset 0 0 0 2px #0d1226}
  .screen{position:absolute;inset:7px;border-radius:35px;background:linear-gradient(180deg,#12183a 0%,#0a0f24 100%);overflow:hidden}
  .island{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:58px;height:17px;background:#000;border-radius:11px;z-index:4}
  .sidebtn{position:absolute;right:-6px;top:84px;width:4px;height:38px;background:#2b3663;border-radius:2px}
  .voldn{position:absolute;left:-6px;top:74px;width:4px;height:30px;background:#2b3663;border-radius:2px}
  .clock{position:absolute;top:44px;left:0;right:0;text-align:center;color:#dfe6ff;font-size:34px;font-weight:600;letter-spacing:1px;opacity:.85}
  .banner{position:absolute;left:8px;right:8px;bottom:20px;background:rgba(243,245,251,.98);border-radius:16px;
    padding:12px 8px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.35);
    opacity:0;transform:translateY(14px);animation:bannerIn 7s infinite}
  .banner .ic{width:30px;height:30px;border-radius:8px;background:var(--bad);display:flex;align-items:center;justify-content:center;font-size:17px;margin:0 auto 8px}
  .banner .t{font-size:13.5px;font-weight:800;color:#111;line-height:1.2}
  .banner .m{font-size:11px;color:#555;margin-top:3px;line-height:1.2}

  .foot{text-align:center;color:var(--dim);font-size:16px;margin-top:66px}
  .foot b{color:var(--ok)}

  @keyframes espFlash{0%{border-color:var(--line)}1%{border-color:var(--bad);box-shadow:0 0 36px 6px rgba(248,113,113,.7)}9%{border-color:var(--line);box-shadow:none}100%{border-color:var(--line)}}
  /* ESP pill: appears on detect, GONE the instant the lock reaches AWS (~29%) */
  @keyframes labelShow{0%{opacity:0}3%{opacity:1}26%{opacity:1}30%{opacity:0}100%{opacity:0}}
  @keyframes travel1{0%{left:0;opacity:0}9%{left:0;opacity:0}11%{left:0;opacity:1}29%{left:100%;opacity:1}31%{left:100%;opacity:0}100%{opacity:0}}
  @keyframes awsPulse{0%{border-color:var(--line);box-shadow:none}29%{box-shadow:none}34%{border-color:var(--accent);box-shadow:0 0 30px 6px rgba(79,124,255,.7)}42%{border-color:var(--line);box-shadow:none}100%{box-shadow:none}}
  /* AWS pill: appears after the lock lands, GONE the instant the notification reaches the phone (~61%) */
  @keyframes awsOut{0%{opacity:0}31%{opacity:0}34%{opacity:1}58%{opacity:1}61%{opacity:0}100%{opacity:0}}
  @keyframes travel2{0%{left:0;opacity:0}42%{left:0;opacity:0}44%{left:0;opacity:1}61%{left:100%;opacity:1}63%{left:100%;opacity:0}100%{opacity:0}}
  @keyframes bannerIn{0%{opacity:0;transform:translateY(14px)}60%{opacity:0;transform:translateY(14px)}64%{opacity:1;transform:translateY(0)}92%{opacity:1;transform:translateY(0)}97%{opacity:0}100%{opacity:0}}
</style>
</head>
<body>
  <div class="stage">
    <div class="title">🛡️ WiFi Intrusion Detection System</div>
    <div class="sub">a $6 chip → encrypted cloud alert → your phone</div>

    <div class="row">
      <div class="node esp">
        <div class="detect" id="detect">⚠ Deauth attack detected</div>
        <div class="big">ESP32</div><div class="small">sniffing 802.11</div>
      </div>

      <div class="wire"><span class="pkt p1">🔒</span></div>

      <div class="node aws">
        <div class="big">AWS</div><div class="small">Lambda · SNS · DynamoDB</div>
        <div class="awsout">🔒 verified → 📧 email + 📊 dashboard</div>
      </div>

      <div class="wire"><span class="pkt p2">🔔</span></div>

      <div class="phone">
        <div class="iphone">
          <div class="sidebtn"></div><div class="voldn"></div>
          <div class="screen">
            <div class="island"></div>
            <div class="clock">9:41</div>
            <div class="banner">
              <span class="ic">🛡️</span>
              <div class="t" id="ptitle">Deauth attack</div>
              <div class="m" id="pmeta">−42 dBm</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="foot">detects <b>deauth</b>, <b>evil-twin</b> &amp; <b>unknown devices</b> — encrypted &amp; serverless</div>
  </div>

<script>
  var scenes = [
    {d:'⚠ Deauth attack detected',  t:'Deauth attack',   m:'−42 dBm',       c:'#f87171'},
    {d:'⚠ Evil-twin AP detected',   t:'Evil twin AP',    m:'unknown BSSID', c:'#f87171'},
    {d:'⚠ Unknown device joined',   t:'Unknown device',  m:'AzureWave',     c:'#fbbf24'}
  ];
  var i = 0;
  function set(){
    var s = scenes[i % scenes.length];
    document.getElementById('detect').textContent = s.d;
    document.getElementById('ptitle').textContent = s.t;
    document.getElementById('pmeta').textContent  = s.m;
    document.querySelector('.banner .ic').style.background = s.c;   // match dashboard severity colour
    i++;
  }
  set();
  // drive the swap off the CSS loop itself (drift-proof) -> new attack type each 7s iteration
  document.querySelector('.esp').addEventListener('animationiteration', set);
</script>
</body>
</html>
