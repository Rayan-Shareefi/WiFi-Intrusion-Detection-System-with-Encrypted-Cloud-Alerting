<!doctype html>
<!--
  WIDS animated explainer — a looping motion graphic that cycles through all three
  detections: ESP32 detects -> encrypted alert to AWS (which processes it) -> phone.

  MAKE IT A VIDEO/GIF for LinkedIn:
   1. Open in a browser, press F11 (full screen).
   2. Record ~20 seconds (it cycles deauth -> evil-twin -> unknown device) with
      ScreenToGif (Windows, records straight to GIF), Xbox Game Bar (Win+G), or OBS.
   3. Post it (pair with a real dashboard screenshot for max impact).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIDS — how it works</title>
<style>
  :root{--bg:#080d1c;--card:#111a35;--line:#1d2950;--txt:#e8edff;--dim:#8794c4;--accent:#4f7cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
  *{box-sizing:border-box;margin:0}
  body{height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(1100px 650px at 50% -12%,#17224e 0%,var(--bg) 58%) no-repeat,var(--bg);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
  .stage{width:min(880px,95vw);padding:10px}
  .title{text-align:center;font-size:22px;font-weight:800}
  .sub{text-align:center;color:var(--dim);font-size:13px;margin:6px 0 54px}

  .row{display:flex;align-items:center;justify-content:center;gap:0}
  .node{flex:none;width:150px;background:var(--card);border:2px solid var(--line);border-radius:14px;
    padding:14px 10px;text-align:center;position:relative}
  .node .big{font-size:18px;font-weight:800}
  .node .small{color:var(--dim);font-size:11px;margin-top:4px}
  .wire{flex:1;max-width:150px;height:3px;border-radius:2px;position:relative;
    background:linear-gradient(90deg,#1d2950,#2a3a6e,#1d2950)}
  .pkt{position:absolute;top:50%;left:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;
    box-shadow:0 0 16px 3px rgba(79,124,255,.7);opacity:0}

  /* ESP detection pill (above) */
  .detect{position:absolute;top:-40px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:rgba(248,113,113,.14);color:var(--bad);border:1px solid rgba(248,113,113,.4);
    border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;opacity:0;animation:labelShow 6s infinite}
  /* AWS "doing something" pill (below) */
  .awsout{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:rgba(79,124,255,.14);color:#9db4ff;border:1px solid rgba(79,124,255,.4);
    border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:700;opacity:0;animation:awsOut 6s infinite}

  .esp{animation:espFlash 6s infinite}
  .aws{animation:awsPulse 6s infinite}
  .p1{animation:travel1 6s infinite}
  .p2{animation:travel2 6s infinite}

  /* phone */
  .phone{flex:none;width:150px;display:flex;justify-content:center}
  .frame{width:82px;height:150px;border-radius:16px;background:#0d1533;border:2px solid #2c3a72;position:relative;overflow:hidden}
  .scr{position:absolute;inset:9px;border-radius:9px;background:#0e1430}
  .banner{position:absolute;left:9px;right:9px;top:9px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--bad);border-radius:8px;padding:7px 8px;text-align:left;opacity:0;transform:translateY(-8px);animation:bannerIn 6s infinite}
  .banner .t{font-size:9.5px;font-weight:700;line-height:1.15}
  .banner .m{font-size:8px;color:var(--dim);margin-top:3px}
  .bell{position:absolute;top:-9px;right:-6px;font-size:13px;background:var(--bad);border-radius:9px;padding:1px 5px;opacity:0;animation:bell 6s infinite}

  .foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:54px}
  .foot b{color:var(--ok)}

  @keyframes espFlash{0%{border-color:var(--line)}1%{border-color:var(--bad);box-shadow:0 0 30px 5px rgba(248,113,113,.7)}9%{border-color:var(--line);box-shadow:none}100%{border-color:var(--line)}}
  @keyframes labelShow{0%{opacity:0}4%{opacity:1}60%{opacity:1}66%{opacity:0}100%{opacity:0}}
  @keyframes travel1{0%{left:0;opacity:0}8%{left:0;opacity:0}10%{left:0;opacity:1}32%{left:100%;opacity:1}34%{left:100%;opacity:0}100%{opacity:0}}
  @keyframes awsPulse{0%{border-color:var(--line);box-shadow:none}33%{box-shadow:none}37%{border-color:var(--accent);box-shadow:0 0 26px 5px rgba(79,124,255,.7)}45%{border-color:var(--line);box-shadow:none}100%{box-shadow:none}}
  @keyframes awsOut{0%{opacity:0}36%{opacity:0}40%{opacity:1}62%{opacity:1}67%{opacity:0}100%{opacity:0}}
  @keyframes travel2{0%{left:0;opacity:0}40%{left:0;opacity:0}42%{left:0;opacity:1}64%{left:100%;opacity:1}66%{left:100%;opacity:0}100%{opacity:0}}
  @keyframes bannerIn{0%{opacity:0;transform:translateY(-8px)}66%{opacity:0;transform:translateY(-8px)}72%{opacity:1;transform:translateY(0)}93%{opacity:1}100%{opacity:0}}
  @keyframes bell{0%{opacity:0;transform:scale(0)}66%{opacity:0;transform:scale(0)}71%{opacity:1;transform:scale(1.2)}75%{transform:scale(1)}93%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
  <div class="stage">
    <div class="title">🛡️ WiFi Intrusion Detection System</div>
    <div class="sub">a $6 chip → encrypted cloud alert → your phone</div>

    <div class="row">
      <div class="node esp">
        <div class="detect" id="detect">⚠ Deauth flood detected</div>
        <div class="big">ESP32</div><div class="small">sniffing 802.11</div>
      </div>

      <div class="wire"><span class="pkt p1">🔒</span></div>

      <div class="node aws">
        <div class="big">AWS</div><div class="small">Lambda · SNS · DynamoDB</div>
        <div class="awsout">🔒 verified → 📧 email + 📊 dashboard</div>
      </div>

      <div class="wire"><span class="pkt p2">🔔</span></div>

      <div class="phone">
        <div class="frame">
          <div class="scr"></div>
          <div class="banner"><span class="bell">🔔</span><div class="t" id="ptitle">⚠️ Deauth flood</div><div class="m" id="pmeta">on your network</div></div>
        </div>
      </div>
    </div>

    <div class="foot">detects <b>deauth</b>, <b>evil-twin</b> &amp; <b>unknown devices</b> — encrypted &amp; serverless</div>
  </div>

<script>
  var scenes = [
    {d:'⚠ Deauth flood detected',   t:'⚠️ Deauth flood',      m:'AA:BB:CC · −42 dBm'},
    {d:'⚠ Evil-twin AP detected',   t:'⚠️ Evil-twin AP',      m:'unknown BSSID'},
    {d:'⚠ Unknown device joined',   t:'⚠️ Unknown device',    m:'54:27:1E · AzureWave'}
  ];
  var i = 0;
  function set(){
    var s = scenes[i % scenes.length];
    document.getElementById('detect').textContent = s.d;
    document.getElementById('ptitle').textContent = s.t;
    document.getElementById('pmeta').textContent  = s.m;
    i++;
  }
  set();
  setInterval(set, 6000);   // matches the 6s CSS loop -> new attack type each cycle
</script>
</body>
</html>
